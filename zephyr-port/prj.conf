CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# DSP thread needs a usable stack and the float unit
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# CMSIS-DSP: forward/inverse FFT, complex magnitude, sqrt/sin/cos
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_FASTMATH=y
